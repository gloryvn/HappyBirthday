<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070b">
  <title>Photocard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="stage" id="stage">
    <div class="aura" id="aura" aria-hidden="true"></div>

    <div class="scene">
      <div class="shadow" id="shadow" aria-hidden="true"></div>

      <div class="card" id="card" role="img" aria-label="Photocard. Drag to rotate, double click to reset.">
        <i class="edge edge--top"></i>
        <i class="edge edge--bottom"></i>
        <i class="edge edge--left"></i>
        <i class="edge edge--right"></i>

        <div class="face face--front {% if not front %}is-missing{% endif %}" style="{% if front %}--shape: url('{{ front }}');{% endif %}">
          {% if front %}<img src="{{ front }}" alt="Photocard, front" draggable="false" decoding="async">{% endif %}
          <div class="fx glare"></div>
          <div class="fx shine"></div>
          <div class="fallback">front image not found</div>
        </div>

        <div class="face face--back {% if not back %}is-missing{% endif %}" style="{% if back %}--shape: url('{{ back }}');{% elif front %}--shape: url('{{ front }}');{% endif %}">
          {% if back %}<img src="{{ back }}" alt="Photocard, back" draggable="false" decoding="async">{% endif %}
          <div class="day-counter" id="day-counter" aria-hidden="true">
            <span class="day-counter__line">Bạn đã bên</span>
            <span class="day-counter__brand">ENHYPEN</span>
            <span class="day-counter__line">được</span>
            <span class="day-counter__number" id="day-count">0</span>
            <span class="day-counter__line">ngày rồi</span>
          </div>
          <div class="fx glare"></div>
          <div class="fx shine"></div>
          <div class="fallback">back image not found</div>
        </div>
      </div>
    </div>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <footer class="ui">
      <div class="controls">
        <button class="btn" id="btn-flip" type="button" aria-label="Flip card" title="Flip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>
        </button>
        <button class="btn" id="btn-reset" type="button" aria-label="Reset view" title="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4.5 4.5v4h4"/></svg>
        </button>
        <button class="btn" id="btn-motion" type="button" aria-label="Motion" aria-pressed="false" title="Motion">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 9.5v5M20 9.5v5"/></svg>
        </button>
      </div>
      <p class="hint" id="hint">Drag to rotate · Double click to reset</p>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
